name: Docker build and runtime checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * 1'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Container ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose with fixture configuration
        run: |
          printf 'OS_API_KEY=owned-compose-fixture\n' > .env
          docker compose config --quiet
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: subtitle-sync:ci
      - name: Check container behavior without provider calls
        run: node scripts/container-check.cjs subtitle-sync:ci
      - name: Start the actual Compose service with fixture credentials
        env:
          SUBTITLE_SYNC_PORT: '0'
        run: |
          docker tag subtitle-sync:ci subtitle-sync:local
          docker compose --project-name subsync-compose-ci up --detach --wait --wait-timeout 90 --no-build
          docker compose --project-name subsync-compose-ci exec -T subtitle-sync node docker/healthcheck.cjs
      - name: Scan runtime OS and application dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: subtitle-sync:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 5m
      - name: Remove fixture configuration
        if: always()
        run: |
          docker compose --project-name subsync-compose-ci down --volumes --remove-orphans
          rm -f .env
